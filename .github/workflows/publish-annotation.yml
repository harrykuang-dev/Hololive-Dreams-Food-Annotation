name: Publish annotation website
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['site/**', '.github/workflows/publish-annotation.yml']
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: annotation-pages
  cancel-in-progress: true
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy
        id: deploy
        uses: actions/deploy-pages@v4
